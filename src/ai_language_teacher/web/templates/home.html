{% extends "base.html" %}
{% block content %}
<h1>Who is studying?</h1>

{% if names %}
<ul class="profiles">
  {% for each in names %}
  <li>
    {# Choosing a profile posts its name, like creating one (spec 026). #}
    <form method="post" action="/students">
      <input type="hidden" name="name" value="{{ each }}">
      <button class="button" type="submit">{{ each }}</button>
    </form>
    <a class="trash" href="/delete?{{ {"name": each}|urlencode }}" aria-label="Delete profile {{ each }}" title="Delete profile"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg></a>
  </li>
  {% endfor %}
</ul>
{% endif %}

<form method="post" action="/students">
  <label for="name">New profile</label>
  <input id="name" name="name" required autocomplete="off">
  <button class="button" type="submit">Start</button>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
</form>
{% endblock %}
