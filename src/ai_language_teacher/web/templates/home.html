{% extends "base.html" %}
{% block content %}
<h1>Who is studying?</h1>

{% if names %}
<ul class="profiles">
  {% for each in names %}
  <li>
    {# Choosing a profile posts its name, like creating one (spec 026). #}
    <form method="post" action="/students">
      <input type="hidden" name="name" value="{{ each }}">
      <button type="submit">{{ each }}</button>
    </form>
    <a class="trash" href="/delete?{{ {"name": each}|urlencode }}" aria-label="Delete profile {{ each }}" title="Delete profile">&#128465;</a>
  </li>
  {% endfor %}
</ul>
{% endif %}

<form method="post" action="/students">
  <label for="name">New profile</label>
  <input id="name" name="name" required autocomplete="off">
  <button type="submit">Start</button>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
</form>
{% endblock %}
