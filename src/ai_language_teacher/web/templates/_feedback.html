<section class="result {{ 'correct' if correct else 'wrong' }}">
  <h1>{% if correct %}Correct!{% else %}Not quite.{% endif %}</h1>
  <p>{{ prompt }}</p>
  <p class="answers">
    <span>Your answer: <strong>{{ answer }}</strong></span>
    <span>Expected: <strong>{{ expected }}</strong></span>
  </p>
</section>
{% for message in unlocks %}
<p class="unlock" role="status">{{ message }}</p>
{% endfor %}
{% if not correct %}
<form method="post" action="/ask/{{ skill }}" class="explain">
  <input type="hidden" name="item" value="{{ item }}">
  <input type="hidden" name="question" value="{{ explain }}">
  <button class="button" type="submit">Explain my mistake</button>
</form>
{% include "_teaching.html" %}
{% endif %}
