<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AI Language Teacher{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header>
    <a class="brand" href="/"><span class="sun" aria-hidden="true"></span><span class="brand-name">AI Language Teacher</span></a>
    {% if courses %}
    <nav aria-label="Main">
      <a href="/dashboard"{% if current == "/dashboard" %} aria-current="page"{% endif %}>Dashboard</a>
      {% for course in courses %}
      <a href="/study/{{ course }}"{% if current == "/study/" ~ course %} aria-current="page"{% endif %}>{{ course|capitalize }}</a>
      {% endfor %}
    </nav>
    {% endif %}
    {% if name %}
    <span class="profile">
      {{ name }}
      <form method="post" action="/logout"><button class="button" type="submit">Logout</button></form>
    </span>
    {% endif %}
  </header>
  <main id="main">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
