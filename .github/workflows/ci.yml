name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      - run: pytest

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip wheel . --no-deps -w dist
      - run: python -m venv /tmp/venv && /tmp/venv/bin/pip install dist/*.whl
      - name: Import lessons from a non-editable install
        working-directory: /tmp
        run: >
          /tmp/venv/bin/python -c "from ai_language_teacher.language.japanese.hiragana import HIRAGANA;
          from ai_language_teacher.language.japanese.katakana import KATAKANA;
          from ai_language_teacher.language.japanese.kanji import KANJI;
          from ai_language_teacher.language.japanese.vocabulary import VOCABULARY;
          assert len(HIRAGANA) == 105 and len(KATAKANA) == 106 and len(KANJI) == 40
          and len(VOCABULARY) == 100"
